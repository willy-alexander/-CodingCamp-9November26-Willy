<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <button id="theme-toggle">Toggle Dark Mode</button>
        <h1>Expense & Budget Visualizer</h1>
        <p>Track your daily expenses easily.</p>
    </header>

    <main>

        <section id="balance-section">
            <h2>Total Balance</h2>
            <h3 id="total-balance">Rp0</h3>
        </section>

        <section id="budget-section">
            <h2>Spending Limit</h2>

            <input
                type="number"
                id="budget-limit"
                placeholder="Enter your spending limit"
                min="1"
            >

            <button id="save-limit">Save Limit</button>

            <div id="budget-summary">
                <p id="budget-display">Spending Limit: Not Set</p>
                <p id="spent-display">Total Spent: Rp0</p>
                <p id="remaining-display">Remaining Budget: Not Set</p>
            </div>

            <p id="budget-warning"></p>
        </section>

        <section id="form-section">
            <h2>Add Transaction</h2>

            <form id="expense-form">

                <div>
                    <label for="item-name">Item Name</label>
                    <input
                        type="text"
                        id="item-name"
                        placeholder="Example: Lunch"
                        required
                    >
                </div>

                <div>
                    <label for="amount">Amount</label>
                    <input
                        type="number"
                        id="amount"
                        placeholder="Example: 25000"
                        min="1"
                        required
                    >
                </div>

                <div>
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Fun">Fun</option>
                    </select>
                </div>

                <button type="submit">Add Transaction</button>

            </form>
        </section>

        <section id="transaction-section">
            <h2>Transaction History</h2>

            <select id="sort-transactions">
                <option value="default">Default</option>
                <option value="highest">Highest Amount</option>
                <option value="lowest">Lowest Amount</option>
                <option value="name">Name A-Z</option>
            </select>

            <ul id="transaction-list"></ul>
        </section>

        <section id="chart-section">
            <h2>Spending Distribution</h2>
            <canvas id="expense-chart"></canvas>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
